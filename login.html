<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHGT Admin Login</title>

<link rel="stylesheet" href="admin.css">

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#0b1f3a;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.login-box{
    width:360px;
    background:#fff;
    padding:30px;
    border-radius:10px;
    box-shadow:0 0 20px rgba(0,0,0,.3);
}

h2{
    text-align:center;
    color:#003366;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:6px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:12px;
    background:#003366;
    color:#fff;
    border:none;
    border-radius:6px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#0055aa;
}
</style>

</head>
<body>

<div class="login-box">

<h2>SHGT Admin Login</h2>

<input type="email" id="email" placeholder="Admin Email">

<input type="password" id="password" placeholder="Password">

<button onclick="login()">Login</button>

</div>

<script>
function login(){

const email=document.getElementById("email").value;

const password=document.getElementById("password").value;

if(email==="admin@shgt.com" && password==="123456"){

window.location="dashboard.html";

}else{

alert("Invalid Login");

}

}
</script>

</body>
</html>
