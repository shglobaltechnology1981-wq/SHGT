<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Edit Product | SHGT</title>

<link rel="stylesheet" href="css/admin.css">

<script type="module" src="js/firebase.js"></script>
<script type="module" src="js/edit-product.js"></script>

</head>

<body>

<div class="container">

<header class="header">

<h1>Edit Product</h1>

<a href="products.html">
<button>Back</button>
</a>

</header>

<div class="login-box" style="width:100%;max-width:900px;margin:30px auto;">

<input type="text" id="name" placeholder="Product Name">

<select id="brand">

<option>JUKI</option>
<option>Brother</option>
<option>Pegasus</option>
<option>Jack</option>
<option>Siruba</option>
<option>Typical</option>
<option>Yamato</option>
<option>Sunstar</option>
<option>Others</option>

</select>

<br><br>

<select id="category">

<option>Machine</option>
<option>Spare Part</option>

</select>

<br><br>

<input type="text" id="model" placeholder="Model">

<input type="text" id="price" placeholder="Price">

<textarea
id="description"
style="width:100%;height:150px;padding:15px;border:1px solid #ddd;border-radius:8px;"
placeholder="Description"></textarea>

<br><br>

<h3>Current Image</h3>

<img
id="preview"
style="width:220px;border-radius:10px;">

<br><br>

<label>

Replace Image (Optional)

</label>

<br><br>

<input
type="file"
id="image"
accept="image/*">

<br><br>

<button id="updateBtn">

Update Product

</button>

<p id="msg"></p>

</div>

</div>

</body>

</html>
