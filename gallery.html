<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gallery | SH Global Technology</title>

<link rel="stylesheet" href="css/style.css">

<style>

.gallery{

max-width:1200px;
margin:auto;
padding:40px 20px;

}

.gallery h1{

text-align:center;
margin-bottom:30px;
color:#003366;

}

.gallery-grid{

display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;

}

.gallery-grid img{

width:100%;
height:220px;
object-fit:cover;
border-radius:10px;
cursor:pointer;
transition:.3s;

}

.gallery-grid img:hover{

transform:scale(1.05);

}

.lightbox{

display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.9);
justify-content:center;
align-items:center;
z-index:9999;

}

.lightbox img{

max-width:90%;
max-height:90%;

}

.close{

position:absolute;
top:20px;
right:30px;
font-size:40px;
color:#fff;
cursor:pointer;

}

</style>

</head>

<body>

<header>

<div class="logo">

<img src="images/logo.png" width="60">

<h2>SH GLOBAL TECHNOLOGY</h2>

</div>

<nav>

<a href="index.html">Home</a>

<a href="gallery.html">Gallery</a>

<a href="contact.html">Contact</a>

</nav>

</header>

<section class="gallery">

<h1>Machine Gallery</h1>

<div class="gallery-grid">

<img src="images/gallery/gallery1.jpg" onclick="showImage(this.src)">
<img src="images/gallery/gallery2.jpg" onclick="showImage(this.src)">
<img src="images/gallery/gallery3.jpg" onclick="showImage(this.src)">
<img src="images/gallery/gallery4.jpg" onclick="showImage(this.src)">
<img src="images/gallery/gallery5.jpg" onclick="showImage(this.src)">
<img src="images/gallery/gallery6.jpg" onclick="showImage(this.src)">
<img src="images/gallery/gallery7.jpg" onclick="showImage(this.src)">
<img src="images/gallery/gallery8.jpg" onclick="showImage(this.src)">

</div>

</section>

<div class="lightbox" id="lightbox">

<span class="close" onclick="closeImage()">&times;</span>

<img id="lightbox-img">

</div>

<script>

function showImage(src){

document.getElementById("lightbox").style.display="flex";

document.getElementById("lightbox-img").src=src;

}

function closeImage(){

document.getElementById("lightbox").style.display="none";

}

</script>

</body>
</html>
